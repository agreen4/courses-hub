<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UP 591 — Professional Development Seminar</title>
  <style>
    :root {
      --color-primary: #1c2b4a;
      --color-accent: #4a9eda;
      --color-accent-mid: #2d6ea0;
      --color-light-bg: #eef4fa;
      --color-text: #1a1a1a;
      --color-muted: #6b7280;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-primary);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 2.5rem 2rem 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .site-title {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-accent);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .instructor {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.6);
      margin-top: 0.4rem;
    }

    main {
      flex: 1;
      padding: 3rem 2rem;
      max-width: 720px;
    }

    .section-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-accent);
      margin-bottom: 1.25rem;
    }

    .cohort-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .cohort-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 1.5rem;
      text-decoration: none;
      color: inherit;
      transition: background 0.15s, border-color 0.15s;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .cohort-card:hover {
      background: rgba(255,255,255,0.1);
      border-color: var(--color-accent);
    }

    .cohort-card .label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-accent);
    }

    .cohort-card .name {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .cohort-card .years {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.55);
    }

    .cohort-card .arrow {
      margin-top: auto;
      padding-top: 0.75rem;
      font-size: 0.8rem;
      color: var(--color-accent);
      font-weight: 600;
    }

    footer {
      padding: 1.5rem 2rem;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 0.75rem;
      color: rgba(255,255,255,0.35);
    }
  </style>
</head>
<body>
  <header>
    <div class="site-title">Department of Urban &amp; Regional Planning · UIUC</div>
    <h1>UP 591 — Professional Development Seminar</h1>
    <div class="instructor">Andrew Greenlee, Instructor</div>
  </header>

  <main>
    <div class="section-label">Active Cohorts</div>
    <div class="cohort-grid">
      <a class="cohort-card" href="/mup-2028/">
        <div class="label">Incoming Cohort</div>
        <div class="name">MUP Class of 2028</div>
        <div class="years">2026 – 2028</div>
        <div class="arrow">View journey →</div>
      </a>
    </div>
  </main>

  <footer>
    courses.andrew-greenlee.com · University of Illinois Urbana-Champaign
  </footer>
</body>
</html>
